# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

source = ~/.config/hypr/catppuccin-hyprland/themes/mocha.conf

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# Use HDR color mode on main monitor
monitorv2 {
    output = desc:Dell Inc. AW3423DWF JYS72S3
    mode=3440x1440@165
    position = 0x0
    scale = 1
    bitdepth = 10
    cm = hdr
    sdrbrightness = 1.0
    sdrsaturation = 1.1
    supports_wide_color = 1
    supports_hdr = 1
    sdr_min_luminance = 0.005
    sdr_max_luminance = 300
    min_luminance = 0
    max_luminance = 1000
    max_avg_luminance = 200
}
monitorv2 {
    output = HDMI-A-1
    mode=highres
    position = auto-up
    scale = 1
}

# experimental:xx_color_management_v4=true
render:cm_fs_passthrough=2
# Recently reenabled
env=ENABLE_HDR_WSI,1
# env = GDK_BACKEND,wayland,x11,*
# env = QT_QPA_PLATFORM,wayland;xcb
# env = SDL_VIDEODRIVER,wayland
# env = CLUTTER_BACKEND,wayland

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

workspace = 1, monitor:desc:Dell Inc. AW3423DWF JYS72S3
workspace = 2, monitor:desc:Dell Inc. AW3423DWF JYS72S3
workspace = 3, monitor:desc:Dell Inc. AW3423DWF JYS72S3
workspace = 4, monitor:desc:Dell Inc. AW3423DWF JYS72S3
workspace = 5, monitor:desc:Dell Inc. AW3423DWF JYS72S3
workspace=6,monitor:HDMI-A-1
workspace=7,monitor:HDMI-A-1
workspace=8,monitor:HDMI-A-1
workspace=9,monitor:HDMI-A-1
workspace=10,monitor:HDMI-A-1

##########################
### SUNSHINE STREAMING ###
##########################
monitor = HEADLESS-2,disable
monitorv2 {
    output = HEADLESS-2
    disabled = true
}
exec-once = hyprctl output create headless
exec-once = uswm app -- sunshine
###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = alacritty
$fileManager = thunar
$menu = fuzzel


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# Taken from https://wiki.hyprland.org/FAQ/#some-of-my-apps-take-a-really-long-time-to-open
exec-once = uwsm app -- dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = uwsm app -- swww-daemon
exec-once = uwsm app -- ~/dotfiles/bin/wallpaper_rot.sh
exec-once = systemctl --user start hyprpolkitagent
exec-once = uwsm app -- waycorner &
exec-once = uwsm app -- sh ~/dotfiles/stow_hypr/.config/hypr/hyprpanel_monitor.sh
exec-once = uwsm app -- nm-applet &
exec-once = uwsm app -- udiskie --smart-tray --no-automount --file-manager thunar --terminal 'alacritty --working-directory' &
# causing problems
# exec-once = uwsm app -- hypridle &
exec-once = uwsm app -- mullvad-vpn &
exec-once = uwsm app -- steam -silent &
exec-once = uwsm app -- discord --start-minimized &
exec-once = uwsm app -- jellyfin-mpv-shim

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

# env = XCURSOR_SIZE,36
# env = XCURSOR_THEME,catppuccin-mocha-green-cursors
# env = HYPRCURSOR_THEME,catppuccin-mocha-green-cursors
# env = HYPRCURSOR_SIZE,36

env = WEBKIT_DISABLE_COMPOSITING_MODE,1
env = NVD_BACKEND,direct

#####################
### LOOK AND FEEL ###
#####################

animations { # https://wiki.hyprland.org/Configuring/Animations/
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 8
    gaps_out = 0, 4, 4, 4

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba($lavenderAlphaee) rgba($lavenderAlphaff) 45deg
    col.inactive_border = rgba($overlay0Alphaaa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = master
    # layout = hy3
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 5

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 2
        color = rgba($baseAlphaff)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(

    focus_on_activate = 1
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 0

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}



###############
### PLUGINS ###
###############
plugin {
      # 2 = keep the nested group only if its parent is a tab group
      # node_collapse_policy = <int> # default: 2

      # offset from group split direction when only one window is in a group
      # group_inset = <int> # default: 10

      # if a tab group will automatically be created for the first window spawned in a workspace
      # tab_first_window = <bool>

      # tab group settings
      tabs {
        # height of the tab bar
        # height = <int> # default: 15

        # padding between the tab bar and its focused node
        # padding = <int> # default: 5

        # the tab bar should animate in/out from the top instead of below the window
        # from_top = <bool> # default: false

        # rounding of tab bar corners
        # rounding = <int> # default: 3

        # render the window title on the bar
        # render_text = <bool> # default: true

        # center the window title
        # text_center = <bool> # default: false

        # font to render the window title with
        # text_font = <string> # default: Sans

        # height of the window title
        # text_height = <int> # default: 8

        # left padding of the window title
        # text_padding = <int> # default: 3

        # active tab bar segment color
        # col.active = <color> # default: 0xff32b4ff

        # urgent tab bar segment color
        # col.urgent = <color> # default: 0xffff4f4f

        # inactive tab bar segment color
        # col.inactive = <color> # default: 0x80808080

        # active tab bar text color
        # col.text.active = <color> # default: 0xff000000

        # urgent tab bar text color
        # col.text.urgent = <color> # default: 0xff000000

        # inactive tab bar text color
        # col.text.inactive = <color> # default: 0xff000000
      }

      # autotiling settings
      autotile {
        # enable autotile
        enable = true # default: false

        # make autotile-created groups ephemeral
        # ephemeral_groups = <bool> # default: true

        # if a window would be squished smaller than this width, a vertical split will be created
        # -1 = never automatically split vertically
        # 0 = always automatically split vertically
        # <number> = pixel height to split at
        # trigger_width = <int> # default: 0

        # if a window would be squished smaller than this height, a horizontal split will be created
        # -1 = never automatically split horizontally
        # 0 = always automatically split horizontally
        # <number> = pixel height to split at
        # trigger_height = <int> # default: 0

        # a space or comma separated list of workspace ids where autotile should be enabled
        # it's possible to create an exception rule by prefixing the definition with "not:"
        # workspaces = 1,2 # autotiling will only be enabled on workspaces 1 and 2
        # workspaces = not:1,2 # autotiling will be enabled on all workspaces except 1 and 2
        # workspaces = <string> # default: all
      }
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(111111)
        workspace_method = first 1i# [center/first] [workspace] e.g. first 1 or center m+1

        enable_gesture = true # laptop touchpad
        gesture_fingers = 3  # 3 or 4
        gesture_distance = 300 # how far is the "max"
        gesture_positive = true # positive = swipe down. Negative = swipe up.
    }

    hyprfocus {
        enabled = yes
        animate_floating = yes
        animate_workspacechange = yes
        focus_animation = shrink
        bezier = realsmooth, 0.28,0.29,0.69,1.08
        # Shrink settings
        shrink {
            shrink_percentage = 0.99
            in_bezier = realsmooth
            in_speed = 1
            out_bezier = realsmooth
            out_speed = 2
        }
    }
}
####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, uwsm app -- $terminal -e tmux -2
bind = $mainMod SHIFT, Q, exec, uwsm app -- ~/dotfiles/stow_hypr/.config/hypr/hyperland_killactive.sh
bind = $mainMod SHIFT, E, exec, uwsm app -- lua ~/dotfiles/bin/fuzzel-power-menu
bind = $mainMod, E, exec, uwsm app -- $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, uwsm app -- $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, N, togglesplit, # dwindle
bind = $mainMod SHIFT, Return, exec, TERMINAL=$terminal ~/dotfiles/bin/rofi_tmux.sh -location 2

# Move focus with mainMod + arrow keys

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, j, movefocus, u
bind = $mainMod, k, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, f, fullscreen

bind = $mainMod, m, layoutmsg, swapwithmaster
bind = $mainMod, Escape, exec, pidof swaylock || uwsm app -- swaylock

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

env = XDG_SCREENSHOTS_DIR,$HOME/Screenshots

bind = $mainMod, S, exec, grimblast copysave active
bind = $mainMod SHIFT, S, exec, grimblast copy area

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Scroll through existing workspaces with mainMod + scroll

# bind = $mainMod, backslash, hy3:changegroup,v,ephemeral
# bind = $mainMod, minus, hy3:changegroup,h,ephemeral
# bind = $mainMod, i, hy3:changegroup,tab,ephemeral
# bind = $mainMod, tab, hyprexpo:expo, toggle

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

windowrule = suppress_event maximize, match:class .* # You'll probably like this.

#######################
### nVidia specific ###
#######################

# Taken from https://wiki.hyprland.org/Nvidia/

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

cursor {
    no_hardware_cursors = true
    # Prevent cursor from being moved when focusing, etc.
    no_warps = true
}

# Settings for xwaylandvideobridge Screen Sharing
# Taken from https://wiki.hyprland.org/Useful-Utilities/Screen-Sharing/
windowrule = opacity 0.0 override 0.0 override, match:class ^(xwaylandvideobridge)$
windowrule = no_anim 1, match:class ^(xwaylandvideobridge)$
windowrule = no_initial_focus 1, match:class ^(xwaylandvideobridge)$
windowrule = max_size 1 1, match:class ^(xwaylandvideobridge)$
windowrule = no_blur 1, match:class ^(xwaylandvideobridge)$

# Float SteamTinkerLaunch windows
windowrule = float on, match:title ^(SteamTinkerLaunch.*)$
debug:full_cm_proto=true
